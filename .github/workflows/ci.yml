name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kb:ci-only-password@127.0.0.1:5432/kb
      REDIS_URL: redis://127.0.0.1:6379
      CHROMA_URL: http://127.0.0.1:8000
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2.1-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/8000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @nexus-kb/api db:migrate:deploy
      - run: pnpm --filter @nexus-kb/api test:integration
      - run: pnpm build

  parser-worker:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: '1'
    defaults:
      run:
        working-directory: apps/parser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/parser-worker/requirements.lock
      - run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch==2.8.0 torchvision==0.23.0
      - run: python -m pip install -r requirements.lock
      - run: ruff check app tests
      - run: mypy app
      - run: pytest
