name: nexus-kb

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
      - path: ./config/runtime.env
        required: false
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - raw_docs:/data/raw-docs
      - preview_artifacts:/data/previews
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      parser-worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend

  parser-worker:
    build:
      context: .
      dockerfile: apps/parser-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
      - path: ./config/runtime.env
        required: false
    environment:
      PARSER_INTERNAL_TOKEN: ${PARSER_INTERNAL_TOKEN}
      RAW_DOCS_PATH: /data/raw-docs
      PREVIEW_ARTIFACTS_PATH: /data/previews
      LIBREOFFICE_EXECUTABLE: ${LIBREOFFICE_EXECUTABLE:-/usr/lib/libreoffice/program/soffice}
      PREVIEW_CONVERSION_TIMEOUT_SECONDS: ${PREVIEW_CONVERSION_TIMEOUT_SECONDS:-120}
      MAX_PREVIEW_BYTES: ${MAX_PREVIEW_BYTES:-209715200}
      # 常规解析保持原生架构；DWG 仅交由 compose.dwg.yaml 的专用 x86 Worker。
      DWG_CONVERSION_ENABLED: 'false'
      PARSER_TEMP_PATH: ${PARSER_TEMP_PATH:-/tmp/parser}
      XDG_CACHE_HOME: /tmp/parser/.cache
      MPLCONFIGDIR: /tmp/parser/.cache/matplotlib
      NLTK_DATA: /opt/nltk_data
      OCR_MODEL_STORAGE_PATH: /opt/easyocr-models
      TIKA_ENABLED: ${TIKA_ENABLED:-true}
      TIKA_BASE_URL: http://tika:9998
      TIKA_VERSION: '3.2.3.0'
      MAX_DWG_CONVERTED_BYTES: ${MAX_DWG_CONVERTED_BYTES:-209715200}
      MAX_ARCHIVE_ENTRIES: ${MAX_ARCHIVE_ENTRIES:-10000}
      MAX_ARCHIVE_UNCOMPRESSED_BYTES: ${MAX_ARCHIVE_UNCOMPRESSED_BYTES:-524288000}
    expose:
      - '8000'
    volumes:
      - raw_docs:/data/raw-docs:ro
      - preview_artifacts:/data/previews
    tmpfs:
      - /tmp:size=1g,mode=1777,uid=10002,gid=10002
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # 仅用于测试的运行器：复用不可变的 Worker 镜像，只挂载测试目录，
  # 使生产容器不携带测试资源或工具。
  parser-worker-tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: apps/parser-worker/Dockerfile
    environment:
      PARSER_INTERNAL_TOKEN: test-internal-token
      RAW_DOCS_PATH: /app/tests/fixtures
      PARSER_TEMP_PATH: /tmp/parser
      TIKA_ENABLED: 'false'
      XDG_CACHE_HOME: /tmp/parser/.cache
      MPLCONFIGDIR: /tmp/parser/.cache/matplotlib
      NLTK_DATA: /opt/nltk_data
      OCR_MODEL_STORAGE_PATH: /opt/easyocr-models
      # Docker Desktop 将加固后的 /tmp tmpfs 挂载为 noexec。将 pytest 的
      # 临时夹具目录保留在隔离的测试绑定挂载中，使 DWG 转换器契约测试可以
      # 执行其模拟转换器。
      PYTEST_ADDOPTS: -p no:cacheprovider --basetemp=/app/tests/.pytest-tmp
    volumes:
      - ./apps/parser-worker/tests:/app/tests
    tmpfs:
      - /tmp:size=1g,mode=1777,uid=10002,gid=10002
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    entrypoint: ['sh', '-c', 'python tests/fixtures/generate-fixtures.py && python -m pytest']

  tika:
    image: apache/tika:3.2.3.0
    restart: unless-stopped
    expose:
      - '9998'
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  reranker-worker:
    build:
      context: .
      dockerfile: apps/reranker-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
      - path: ./config/runtime.env
        required: false
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LOCAL_RERANK_ENABLED: ${LOCAL_RERANK_ENABLED:-false}
      RERANK_INTERNAL_TOKEN: ${RERANK_INTERNAL_TOKEN:-}
      PARSER_INTERNAL_TOKEN: ${PARSER_INTERNAL_TOKEN}
      LOCAL_RERANK_MODEL_REVISION: ${LOCAL_RERANK_MODEL_REVISION:-main}
    expose:
      - '8100'
    volumes:
      - reranker_models:/models
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=10003,gid=10003
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  deployment-agent:
    profiles:
      - configuration
    build:
      context: .
      dockerfile: apps/deployment-agent/Dockerfile
    restart: unless-stopped
    environment:
      DEPLOYMENT_AGENT_PORT: 8200
      DEPLOYMENT_AGENT_TOKEN: ${DEPLOYMENT_AGENT_TOKEN:-}
      DEPLOYMENT_WORKSPACE: ${PWD}
    working_dir: ${PWD}
    expose:
      - '8200'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose 连接宿主机守护进程，因此宿主机与容器内路径必须保持一致。
      - .:${PWD}:ro
      - ./config:${PWD}/config:rw
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8200/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  reranker-model-init:
    profiles:
      - model-init
    build:
      context: .
      dockerfile: apps/reranker-worker/Dockerfile
    restart: 'no'
    environment:
      HF_HOME: /models/cache
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      LOCAL_RERANK_MODEL_REVISION: ${LOCAL_RERANK_MODEL_REVISION:-main}
    command:
      - python
      - -c
      - from sentence_transformers import CrossEncoder; import os; CrossEncoder(os.environ['RERANK_MODEL'], revision=os.environ['LOCAL_RERANK_MODEL_REVISION'], trust_remote_code=False)
    volumes:
      - reranker_models:/models
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=10003,gid=10003
    security_opt:
      - no-new-privileges:true
    networks:
      - model-download

  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:8.2.1-bookworm
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 6
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: 'TRUE'
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: 'FALSE'
    expose:
      - '8000'
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  edge: {}
  backend:
    internal: true
  model-download: {}

volumes:
  raw_docs: {}
  preview_artifacts: {}
  postgres_data: {}
  redis_data: {}
  chroma_data: {}
  reranker_models: {}
