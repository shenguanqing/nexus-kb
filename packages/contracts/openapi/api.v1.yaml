openapi: 3.1.0
info:
  title: NexusKB API
  version: 0.5.0
security:
  - bearerAuth: []
paths:
  /metrics:
    get:
      security: []
      summary: Export Prometheus metrics without business identifiers or content
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /v1/audit/events:
    get:
      summary: List recent structured audit events in the authenticated tenant
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AuditEventType' }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Bodyless tenant-scoped audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditQueryResponse' }
        '400':
          description: Invalid audit query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/knowledge/query:
    post:
      summary: Answer a knowledge question with tenant-scoped sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeQueryRequest' }
      responses:
        '200':
          description: Grounded answer or explicit no-answer response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeQueryResponse' }
        '400':
          description: Invalid question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: User or tenant query rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/documents:
    post:
      summary: Upload a document and enqueue ingestion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadAccepted' }
        '409':
          description: Content already exists in the same tenant and ACL scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Get a tenant-scoped document
      responses:
        '200': { description: Document metadata }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Idempotently delete a tenant-scoped document
      responses:
        '200': { description: Deleted or already absent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/documents/{documentId}/reindex:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Create and enqueue a new version while the active version remains queryable
      responses:
        '202':
          description: Reindex queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Document is not active or another ingestion job is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/ingestion-jobs/{jobId}:
    get:
      summary: Get a tenant-scoped ingestion job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Ingestion job }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/ingestion-jobs/failed:
    get:
      summary: List recent failed ingestion jobs in the authenticated tenant
      responses:
        '200':
          description: Up to 50 failed jobs ordered by most recent update
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/IngestionJobSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AuditEventType:
      type: string
      enum: [query, document_lifecycle, cloud_policy]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          event,
          outcome,
          traceId,
          actorUserId,
          documentId,
          ingestionJobId,
          attributes,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AuditEventType' }
        event: { type: string, maxLength: 128 }
        outcome: { type: string, maxLength: 128 }
        traceId: { type: [string, 'null'], format: uuid }
        actorUserId: { type: [string, 'null'] }
        documentId: { type: [string, 'null'], format: uuid }
        ingestionJobId: { type: [string, 'null'], format: uuid }
        attributes:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
              - { type: 'null' }
              - type: array
                items: { type: string }
        createdAt: { type: string, format: date-time }
    AuditQueryResponse:
      type: object
      additionalProperties: false
      required: [events, nextBefore]
      properties:
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextBefore: { type: [string, 'null'], format: date-time }
    KnowledgeQueryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 2, maxLength: 2000 }
    KnowledgeSource:
      type: object
      additionalProperties: false
      required: [index, documentId, documentVersion, chunkIds, sourceName, page, sheet, sectionPath]
      properties:
        index: { type: integer, minimum: 1 }
        documentId: { type: string, format: uuid }
        documentVersion: { type: integer, minimum: 1 }
        chunkIds:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceName: { type: string }
        page: { type: [integer, 'null'], minimum: 1 }
        sheet: { type: [string, 'null'] }
        sectionPath:
          type: array
          items: { type: string }
    KnowledgeQueryResponse:
      type: object
      additionalProperties: false
      required: [answer, noAnswer, reason, traceId, sources, model, rerankDegraded]
      properties:
        answer: { type: string, minLength: 1 }
        noAnswer: { type: boolean }
        reason:
          { type: [string, 'null'], enum: [insufficient_relevance, authorization_changed, null] }
        traceId: { type: string, format: uuid }
        sources:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeSource' }
        model:
          oneOf:
            - type: object
              additionalProperties: false
              required: [provider, model, fallbackUsed]
              properties:
                provider: { type: string }
                model: { type: string }
                fallbackUsed: { type: boolean }
            - type: 'null'
        rerankDegraded: { type: boolean }
    UploadAccepted:
      type: object
      required: [documentId, jobId, status, traceId]
      properties:
        documentId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { const: queued }
        traceId: { type: string, format: uuid }
    ReindexAccepted:
      type: object
      additionalProperties: false
      required: [documentId, documentVersion, jobId, status, traceId]
      properties:
        documentId: { type: string, format: uuid }
        documentVersion: { type: integer, minimum: 2 }
        jobId: { type: string, format: uuid }
        status: { const: queued }
        traceId: { type: string, format: uuid }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string, format: uuid }
    DocumentStatus:
      type: string
      enum: [uploaded, processing, prepared, active, policy_blocked, failed, deleting, deleted]
    IngestionStatus:
      type: string
      enum:
        [
          queued,
          converting,
          parsing,
          chunking,
          policy_check,
          embedding,
          indexing,
          policy_blocked,
          completed,
          failed,
          deleted,
        ]
    IngestionJobSummary:
      type: object
      required:
        [
          id,
          documentId,
          version,
          kind,
          status,
          step,
          checkpoint,
          attempts,
          traceId,
          retryable,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [ingestion, reindex, index_migration] }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        step: { type: string }
        checkpoint: { type: string }
        attempts: { type: integer, minimum: 0 }
        traceId: { type: string, format: uuid }
        errorCode: { type: [string, 'null'] }
        errorCategory: { type: [string, 'null'] }
        retryable: { type: boolean }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Missing, invalid or expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated identity lacks the required capability
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource does not exist in the authenticated tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
