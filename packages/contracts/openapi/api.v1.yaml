openapi: 3.1.0
info:
  title: NexusKB API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
    description: Mac local development
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /health/live:
    get:
      security: []
      summary: Confirm that the API process is alive without checking dependencies
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveResponse' }
  /health/ready:
    get:
      security: []
      summary: Check PostgreSQL, Redis, Chroma, Parser Worker and document storage readiness
      responses:
        '200':
          description: All required dependencies are ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }
        '503':
          description: One or more required dependencies are not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }
  /v1/auth/login-options:
    get:
      security: []
      summary: Return the enabled browser login method without exposing account details
      responses:
        '200':
          description: Public login method summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthLoginOptions' }
  /v1/auth/password/login:
    post:
      security: []
      summary: Start a password-authenticated server-side session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginRequest' }
      responses:
        '200':
          description: Authenticated identity summary and an HttpOnly session cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400':
          description: Invalid account-password login request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Too many failed login attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/auth/logout:
    post:
      security: []
      summary: Revoke the current password-authenticated session if present
      responses:
        '200':
          description: Session cookie cleared
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthLogoutResponse' }
  /v1/auth/session:
    get:
      summary: Return the authenticated server-side identity summary
      responses:
        '200':
          description: Authenticated identity and capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /metrics:
    get:
      security: []
      summary: Export Prometheus metrics without business identifiers or content
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /v1/audit/events:
    get:
      summary: List recent structured audit events in the authenticated tenant
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AuditEventType' }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Bodyless tenant-scoped audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditQueryResponse' }
        '400':
          description: Invalid audit query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/system/providers:
    get:
      summary: Return sanitized model Provider configuration summaries
      responses:
        '200':
          description: Provider identifiers, models, endpoint hosts, credential flags and index fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/system/status:
    get:
      summary: Return sanitized dependency, ingestion queue and storage status
      responses:
        '200':
          description: Current system status without internal addresses or stack traces
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/system/configuration:
    get:
      summary: Return the current sanitized runtime configuration and recent immutable versions
      responses:
        '200':
          description: Write-only secret flags, editable values and version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemConfigurationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/system/configurations:
    post:
      summary: Validate and create an immutable encrypted runtime configuration version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemConfigurationUpdateRequest' }
      responses:
        '201':
          description: Configuration version created but not yet deployed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemConfigurationVersion' }
        '400': { description: Invalid or incompatible configuration }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Controlled deployment is not configured }
  /v1/system/configurations/{configurationId}/deploy:
    post:
      summary: Ask the internal allowlisted deployment agent to recreate affected services
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Asynchronous deployment accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDeploymentAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A deployment is already running or the version is not deployable }
        '503': { description: Internal deployment agent unavailable }
  /v1/system/deployments:
    get:
      summary: List recent controlled configuration deployments
      responses:
        '200':
          description: Deployment status history without command output or secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDeploymentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/system/deployments/{deploymentId}:
    get:
      summary: Poll one controlled deployment and readiness result
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current deployment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDeployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/system/deployments/{deploymentId}/rollback:
    post:
      summary: Re-deploy the previous successful configuration version
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Asynchronous rollback accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDeploymentAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: No previous version is available or another deployment is running }
  /v1/access/users:
    get:
      summary: List managed local accounts and observed authenticated users within the caller's tenant or department scope
      parameters:
        - { name: query, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: department, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: Tenant-isolated or department-limited user directory page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDirectoryQueryResponse' }
        '400':
          description: Invalid user directory query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a local password account in the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedUserCreateRequest' }
      responses:
        '200':
          description: Local account created and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserMutationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Username or user ID already exists }
  /v1/access/users/{userId}:
    patch:
      summary: Update a managed local password account
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, maxLength: 256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedUserUpdateRequest' }
      responses:
        '200':
          description: Account updated and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserMutationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: External account or final administrator protection }
    delete:
      summary: Delete a managed local password account
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: Account deleted and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: External account or final administrator protection }
  /v1/access/users/{userId}/roles:
    patch:
      summary: Replace the application role for an observed tenant user
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, maxLength: 256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleUpdateRequest' }
      responses:
        '200':
          description: Application role updated with last-admin protection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoleUpdateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Last administrator cannot be removed }
  /v1/access/departments:
    get:
      summary: List tenant or department scoped effective department policies
      responses:
        '200':
          description: Department policy summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentPolicyListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/access/departments/{department}:
    patch:
      summary: Restrict a department sensitivity policy
      parameters:
        - { name: department, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentPolicyUpdateRequest' }
      responses:
        '200':
          description: Effective department policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentPolicyUpdateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/history/conversations:
    get:
      summary: List only the authenticated user's conversations
      parameters:
        - { name: query, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: User-owned conversation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/history/conversations/{conversationId}:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a user-owned conversation
      responses:
        '200':
          description: Conversation and turns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a user-owned conversation and its turns
      responses:
        '200':
          description: Conversation deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDeleteResponse' }
  /v1/system/usage:
    get:
      summary: Aggregate tenant query and persisted Provider usage facts for platform administrators
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Tenant query usage with Provider-reported token and configured cost fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/knowledge/query:
    post:
      summary: Answer a knowledge question with tenant-scoped sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeQueryRequest' }
      responses:
        '200':
          description: Grounded answer, general-knowledge supplement or explicit no-answer response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeQueryResponse' }
        '400':
          description: Invalid question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: User or tenant query rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/documents:
    get:
      summary: List ACL-visible documents with server-side filtering and pagination
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: department, in: query, schema: { type: string, maxLength: 128 } }
        - { name: sensitivity, in: query, schema: { $ref: '#/components/schemas/Sensitivity' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DocumentStatus' } }
        - { name: format, in: query, schema: { $ref: '#/components/schemas/DocumentFormat' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: ACL-filtered document page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentListResponse' }
        '400': { description: Invalid list query }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Upload a document and enqueue ingestion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadAccepted' }
        '409':
          description: Content already exists in the same tenant and ACL scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/documents/upload-options:
    get:
      summary: Return server-owned upload limits and identity-scoped metadata options
      responses:
        '200':
          description: Upload options for the authenticated identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Get a tenant-scoped document
      responses:
        '200':
          description: Document metadata and version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Idempotently delete a tenant-scoped document
      responses:
        '200':
          description: Deleted or already absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/documents/{documentId}/chunks:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List complete chunks for one ACL-visible document version
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: ACL-authorized original and redacted chunk details without vector values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentChunkListResponse' }
        '400':
          description: Invalid chunk pagination or version request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/documents/{documentId}/preview:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Describe the ACL-authorized document preview or extracted-text fallback
      responses:
        '200':
          description: Preview manifest without storage paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/documents/{documentId}/preview/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Stream ACL-authorized native or generated preview content
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=\d*-\d*$' }
      responses:
        '200':
          description: Complete preview content
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
            text/markdown: { schema: { type: string } }
        '206': { description: Requested byte range }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Native or generated preview content is not ready }
        '416': { description: Invalid byte range }
  /v1/documents/{documentId}/preview/overview:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Stream the ACL-authorized CAD overview image
      responses:
        '200':
          description: Complete CAD overview PNG
          content:
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CAD tile preview is not ready }
  /v1/documents/{documentId}/preview/focus-overview:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Stream the ACL-authorized CAD main-geometry overview image
      responses:
        '200':
          description: Focused CAD main-geometry overview PNG
          content:
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CAD focus overview is not available }
  /v1/documents/{documentId}/preview/tiles/{zoom}/{tileX}/{tileY}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: zoom, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 15 } }
      - {
          name: tileX,
          in: path,
          required: true,
          schema: { type: integer, minimum: 0, maximum: 65535 },
        }
      - {
          name: tileY,
          in: path,
          required: true,
          schema: { type: integer, minimum: 0, maximum: 65535 },
        }
    get:
      summary: Generate on cache miss and stream one ACL-authorized CAD PNG tile
      responses:
        '200':
          description: Requested CAD tile
          headers:
            X-Cad-Tile-Cache:
              schema: { type: string, enum: [hit, miss] }
          content:
            image/png: { schema: { type: string, format: binary } }
        '400': { description: Tile coordinate is outside the manifest grid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CAD tile preview is not ready }
        '503': { description: CAD tile rendering is unavailable or exceeded a resource limit }
        '504': { description: CAD tile rendering timed out }
  /v1/documents/{documentId}/reindex:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Resume a prepared version or create and enqueue a new version while the active version remains queryable
      responses:
        '202':
          description: Reindex queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Document is not active or another ingestion job is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/documents/{documentId}/metadata:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    patch:
      summary: Update authorized ACL metadata and enqueue a safe new document version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [department, sensitivity]
              properties:
                department: { type: string, minLength: 1, maxLength: 128 }
                sensitivity: { $ref: '#/components/schemas/Sensitivity' }
      responses:
        '202':
          description: Metadata updated and reindex queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/ingestion-jobs:
    get:
      summary: List ACL-visible ingestion jobs with server-side pagination
      parameters:
        - { name: documentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IngestionStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: ACL-filtered ingestion job page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJobListResponse' }
        '400': { description: Invalid ingestion job query }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/ingestion-jobs/{jobId}:
    get:
      summary: Get a tenant-scoped ingestion job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ingestion job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/ingestion-jobs/{jobId}/retry:
    post:
      summary: Requeue an ACL-visible retryable failed ingestion job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Retry queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRetryAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Job is not failed or retryable }
  /v1/ingestion-jobs/failed:
    get:
      summary: List recent failed ingestion jobs in the authenticated tenant
      responses:
        '200':
          description: Up to 50 failed jobs ordered by most recent update
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/IngestionJobSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: nexuskb_session
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthLiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ok }
    HealthCheck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [up, down] }
        reason:
          type: string
          enum: [unavailable, unhealthy, configuration_mismatch]
    HealthReadyResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { $ref: '#/components/schemas/HealthCheck' }
    Sensitivity:
      type: string
      enum: [public, internal, confidential]
    AuthSession:
      type: object
      additionalProperties: false
      required: [authenticated, mode, identity]
      properties:
        authenticated: { const: true }
        mode: { type: string, enum: [development, password, oidc] }
        identity:
          type: object
          additionalProperties: false
          required:
            [
              tenantId,
              userId,
              department,
              roles,
              allowedSensitivities,
              capabilities,
              defaultSensitivity,
            ]
          properties:
            tenantId: { type: string }
            userId: { type: string }
            department: { type: string }
            roles:
              type: array
              minItems: 1
              maxItems: 1
              items: { type: string, enum: [user, admin] }
            allowedSensitivities:
              type: array
              minItems: 1
              items: { type: string, enum: [public, internal, confidential] }
            capabilities:
              type: array
              items:
                type: string
                enum:
                  [
                    documents:read,
                    documents:write,
                    documents:delete,
                    audit:read,
                    system:read,
                    system:configure,
                    system:deploy,
                    access:read,
                    access:write,
                  ]
            defaultSensitivity: { type: string, enum: [public, internal, confidential] }
    AuthLoginOptions:
      type: object
      additionalProperties: false
      required: [mode, passwordEnabled]
      properties:
        mode: { type: string, enum: [development, password, oidc] }
        passwordEnabled: { type: boolean }
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [loggedOut]
      properties:
        loggedOut: { const: true }
    UserDirectoryEntry:
      type: object
      additionalProperties: false
      required: [userId, username, department, roles, roleSource, status, lastAuthenticatedAt]
      properties:
        userId: { type: string, minLength: 1, maxLength: 256 }
        username: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        department: { type: string, minLength: 1, maxLength: 128 }
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [user, admin] }
        roleSource: { type: string, enum: [identity, managed] }
        status: { type: string, enum: [active, disabled, observed] }
        lastAuthenticatedAt: { type: string, format: date-time }
    UserDirectoryQueryResponse:
      type: object
      additionalProperties: false
      required: [users, total, offset, limit, scope]
      properties:
        users:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UserDirectoryEntry' }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        scope: { type: string, enum: [tenant, department] }
    UserRoleUpdateRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [user, admin]
    UserRoleUpdateResponse:
      type: object
      additionalProperties: false
      required: [user, traceId]
      properties:
        user: { $ref: '#/components/schemas/UserDirectoryEntry' }
        traceId: { type: string, format: uuid }
    ManagedUserCreateRequest:
      type: object
      additionalProperties: false
      required:
        [userId, username, password, department, roles, allowedSensitivities, defaultSensitivity]
      properties:
        userId: { type: string, minLength: 1, maxLength: 256 }
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
        department: { type: string, minLength: 1, maxLength: 128 }
        roles: { $ref: '#/components/schemas/UserRoleUpdateRequest/properties/roles' }
        allowedSensitivities:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/Sensitivity' }
        defaultSensitivity: { $ref: '#/components/schemas/Sensitivity' }
    ManagedUserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        department: { type: string, minLength: 1, maxLength: 128 }
        roles: { $ref: '#/components/schemas/UserRoleUpdateRequest/properties/roles' }
        allowedSensitivities:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/Sensitivity' }
        defaultSensitivity: { $ref: '#/components/schemas/Sensitivity' }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
        enabled: { type: boolean }
    ManagedUserMutationResponse:
      type: object
      additionalProperties: false
      required: [user, traceId]
      properties:
        user: { $ref: '#/components/schemas/UserDirectoryEntry' }
        traceId: { type: string, format: uuid }
    ManagedUserDeleteResponse:
      type: object
      additionalProperties: false
      required: [deleted, traceId]
      properties:
        deleted: { const: true }
        traceId: { type: string, format: uuid }
    DepartmentPolicy:
      type: object
      additionalProperties: false
      required: [department, allowedSensitivities, userCount, documentCount, managed, updatedAt]
      properties:
        department: { type: string, minLength: 1, maxLength: 128 }
        allowedSensitivities:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/Sensitivity' }
        userCount: { type: integer, minimum: 0 }
        documentCount: { type: integer, minimum: 0 }
        managed: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
    DepartmentPolicyListResponse:
      type: object
      additionalProperties: false
      required: [departments, scope]
      properties:
        departments:
          type: array
          items: { $ref: '#/components/schemas/DepartmentPolicy' }
        scope: { type: string, enum: [tenant, department] }
    DepartmentPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [allowedSensitivities]
      properties:
        allowedSensitivities:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/Sensitivity' }
    DepartmentPolicyUpdateResponse:
      type: object
      additionalProperties: false
      required: [department, traceId]
      properties:
        department: { $ref: '#/components/schemas/DepartmentPolicy' }
        traceId: { type: string, format: uuid }
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, title, messageCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        messageCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationListResponse:
      type: object
      additionalProperties: false
      required: [conversations, total, offset, limit]
      properties:
        conversations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ConversationSummary' }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ConversationTurn:
      type: object
      additionalProperties: false
      required:
        [
          id,
          question,
          answer,
          noAnswer,
          reason,
          answerMode,
          traceId,
          sources,
          sourceCount,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        question: { type: string, minLength: 1, maxLength: 2000 }
        answer: { type: string, minLength: 1 }
        noAnswer: { type: boolean }
        reason:
          { type: [string, 'null'], enum: [insufficient_relevance, authorization_changed, null] }
        answerMode: { type: [string, 'null'], enum: [grounded, general, null] }
        traceId: { type: string, format: uuid }
        sources:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/KnowledgeSource' }
        sourceCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ConversationDetail:
      allOf:
        - { $ref: '#/components/schemas/ConversationSummary' }
        - type: object
          required: [turns]
          properties:
            turns:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/ConversationTurn' }
    ConversationDeleteResponse:
      type: object
      additionalProperties: false
      required: [conversationId, deleted]
      properties:
        conversationId: { type: string, format: uuid }
        deleted: { const: true }
    UsageProviderRow:
      type: object
      additionalProperties: false
      required:
        [kind, provider, model, requests, failures, inputTokens, outputTokens, estimatedCostUsd]
      properties:
        kind: { type: string, enum: [embedding, rerank, llm] }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        requests: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        estimatedCostUsd: { type: [number, 'null'], minimum: 0 }
    UsageResponse:
      type: object
      additionalProperties: false
      required:
        [
          from,
          to,
          totalQueries,
          failureRate,
          queryP50Ms,
          queryP95Ms,
          providers,
          departments,
          usageCompleteness,
        ]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalQueries: { type: integer, minimum: 0 }
        failureRate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        queryP50Ms: { type: [integer, 'null'], minimum: 0 }
        queryP95Ms: { type: [integer, 'null'], minimum: 0 }
        providers:
          type: array
          items: { $ref: '#/components/schemas/UsageProviderRow' }
        departments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [department, requests]
            properties:
              department: { type: string, minLength: 1 }
              requests: { type: integer, minimum: 1 }
        usageCompleteness: { type: string, enum: [request_only, tokens_and_cost] }
    ProviderStatus:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          provider,
          model,
          configurationStatus,
          endpointHost,
          region,
          dimensions,
          credentialConfigured,
          fingerprint,
        ]
      properties:
        kind: { type: string, enum: [embedding, llm, llm_fallback, rerank] }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        configurationStatus: { type: string, enum: [configured, disabled] }
        endpointHost: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        dimensions: { type: [integer, 'null'], minimum: 1 }
        credentialConfigured: { type: boolean }
        fingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    ProviderStatusResponse:
      type: object
      additionalProperties: false
      required: [providers, syntheticCheck]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderStatus' }
        syntheticCheck:
          type: object
          additionalProperties: false
          required: [status, checkedAt]
          properties:
            status: { const: not_configured }
            checkedAt: { type: 'null' }
    SystemComponent:
      type: object
      additionalProperties: false
      required: [id, status, reason]
      properties:
        id:
          type: string
          enum: [api, postgres, redis, chroma, parserWorker, rawDocs]
        status: { type: string, enum: [up, down] }
        reason:
          type: [string, 'null']
          enum: [unavailable, unhealthy, configuration_mismatch, null]
    SystemStatusResponse:
      type: object
      additionalProperties: false
      required: [status, checkedAt, components, ingestionQueue, rawDocsDiskUsageRatio]
      properties:
        status: { type: string, enum: [ready, degraded] }
        checkedAt: { type: string, format: date-time }
        components:
          type: array
          items: { $ref: '#/components/schemas/SystemComponent' }
        ingestionQueue:
          type: object
          additionalProperties: false
          required: [status, waiting, active, delayed, failed, oldestWaitSeconds]
          properties:
            status: { type: string, enum: [up, down] }
            waiting: { type: [integer, 'null'], minimum: 0 }
            active: { type: [integer, 'null'], minimum: 0 }
            delayed: { type: [integer, 'null'], minimum: 0 }
            failed: { type: [integer, 'null'], minimum: 0 }
            oldestWaitSeconds: { type: [number, 'null'], minimum: 0 }
        rawDocsDiskUsageRatio: { type: [number, 'null'], minimum: 0, maximum: 1 }
    SystemConfigurationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [changeReason]
      properties:
        values:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: number }, { type: boolean }] }
        secrets:
          type: object
          writeOnly: true
          additionalProperties: { type: string, minLength: 1, maxLength: 4096, format: password }
        changeReason: { type: string, minLength: 3, maxLength: 500 }
    SystemConfigurationVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          status,
          values,
          secretConfigured,
          changedKeys,
          changeReason,
          createdBy,
          createdAt,
          activatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, active, failed, superseded] }
        values: { type: object, additionalProperties: true }
        secretConfigured:
          type: object
          additionalProperties: { type: boolean }
        changedKeys: { type: array, items: { type: string } }
        changeReason: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
    SystemConfigurationResponse:
      type: object
      additionalProperties: false
      required:
        [
          deploymentAgentAvailable,
          embeddingManagedSeparately,
          effectiveValues,
          secretConfigured,
          current,
          versions,
        ]
      properties:
        deploymentAgentAvailable: { type: boolean }
        embeddingManagedSeparately: { const: true }
        effectiveValues: { type: object, additionalProperties: true }
        secretConfigured: { type: object, additionalProperties: { type: boolean } }
        current:
          oneOf:
            - { $ref: '#/components/schemas/SystemConfigurationVersion' }
            - { type: 'null' }
        versions:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SystemConfigurationVersion' }
    SystemDeployment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          status,
          services,
          configVersion,
          changeReason,
          previousVersion,
          rollbackAvailable,
          errorCode,
          createdAt,
          startedAt,
          completedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, rolled_back, failed] }
        services:
          type: array
          minItems: 1
          items: { type: string, enum: [api, parser-worker, parser-worker-dwg, reranker-worker] }
        configVersion: { type: integer, minimum: 1 }
        changeReason: { type: string, minLength: 1, maxLength: 500 }
        previousVersion: { type: [integer, 'null'], minimum: 1 }
        rollbackAvailable: { type: boolean }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    SystemDeploymentAccepted:
      type: object
      additionalProperties: false
      required: [deployment]
      properties:
        deployment: { $ref: '#/components/schemas/SystemDeployment' }
    SystemDeploymentListResponse:
      type: object
      additionalProperties: false
      required: [deployments]
      properties:
        deployments:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/SystemDeployment' }
    AuditEventType:
      type: string
      enum: [query, document_lifecycle, cloud_policy, access_change]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          event,
          outcome,
          traceId,
          actorUserId,
          documentId,
          ingestionJobId,
          attributes,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AuditEventType' }
        event: { type: string, maxLength: 128 }
        outcome: { type: string, maxLength: 128 }
        traceId: { type: [string, 'null'], format: uuid }
        actorUserId: { type: [string, 'null'] }
        documentId: { type: [string, 'null'], format: uuid }
        ingestionJobId: { type: [string, 'null'], format: uuid }
        attributes:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
              - { type: 'null' }
              - type: array
                items: { type: string }
        createdAt: { type: string, format: date-time }
    AuditQueryResponse:
      type: object
      additionalProperties: false
      required: [events, nextBefore, total]
      properties:
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextBefore: { type: [string, 'null'], format: date-time }
        total: { type: integer, minimum: 0 }
    KnowledgeQueryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        conversationId: { type: string, format: uuid }
        question: { type: string, minLength: 2, maxLength: 2000 }
    KnowledgeSource:
      type: object
      additionalProperties: false
      required: [index, documentId, documentVersion, chunkIds, sourceName, page, sheet, sectionPath]
      properties:
        index: { type: integer, minimum: 1 }
        documentId: { type: string, format: uuid }
        documentVersion: { type: integer, minimum: 1 }
        chunkIds:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceName: { type: string }
        page: { type: [integer, 'null'], minimum: 1 }
        sheet: { type: [string, 'null'] }
        sectionPath:
          type: array
          items: { type: string }
    KnowledgeQueryResponse:
      type: object
      additionalProperties: false
      required:
        [
          conversationId,
          answer,
          noAnswer,
          reason,
          answerMode,
          traceId,
          sources,
          model,
          rerankDegraded,
        ]
      properties:
        conversationId: { type: string, format: uuid }
        answer: { type: string, minLength: 1 }
        noAnswer: { type: boolean }
        reason:
          { type: [string, 'null'], enum: [insufficient_relevance, authorization_changed, null] }
        answerMode: { type: [string, 'null'], enum: [grounded, general, null] }
        traceId: { type: string, format: uuid }
        sources:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeSource' }
        model:
          oneOf:
            - type: object
              additionalProperties: false
              required: [provider, model, fallbackUsed]
              properties:
                provider: { type: string }
                model: { type: string }
                fallbackUsed: { type: boolean }
            - type: 'null'
        rerankDegraded: { type: boolean }
    UploadAccepted:
      type: object
      required: [documentId, jobId, status, traceId]
      properties:
        documentId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { const: queued }
        traceId: { type: string, format: uuid }
    ReindexAccepted:
      type: object
      additionalProperties: false
      required: [documentId, documentVersion, jobId, status, traceId]
      properties:
        documentId: { type: string, format: uuid }
        documentVersion: { type: integer, minimum: 2 }
        jobId: { type: string, format: uuid }
        status: { const: queued }
        traceId: { type: string, format: uuid }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string, format: uuid }
    DocumentStatus:
      type: string
      enum: [uploaded, processing, prepared, active, policy_blocked, failed, deleting, deleted]
    DocumentFormat:
      type: string
      enum: [txt, md, pdf, doc, docx, xlsx, png, jpg, jpeg, dxf, dwg]
    DocumentListItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          sourceName,
          mimeType,
          department,
          sensitivity,
          ownerId,
          activeVersion,
          status,
          latestJob,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        sourceName: { type: string }
        mimeType: { type: string }
        department: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        ownerId: { type: string }
        activeVersion: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        latestJob:
          oneOf:
            - { $ref: '#/components/schemas/LatestIngestionJob' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LatestIngestionJob:
      type: object
      additionalProperties: false
      required: [id, status, step, attempts, retryable, errorCode, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        step: { type: string }
        attempts: { type: integer, minimum: 0 }
        retryable: { type: boolean }
        errorCode: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    DocumentListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DocumentListItem' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    DocumentUploadOptions:
      type: object
      additionalProperties: false
      required:
        [
          maxUploadBytes,
          acceptedExtensions,
          department,
          allowedSensitivities,
          defaultSensitivity,
          dwgConversionEnabled,
        ]
      properties:
        maxUploadBytes: { type: integer, minimum: 1 }
        acceptedExtensions:
          { type: array, minItems: 1, items: { $ref: '#/components/schemas/DocumentFormat' } }
        department: { type: string }
        allowedSensitivities:
          { type: array, minItems: 1, items: { $ref: '#/components/schemas/Sensitivity' } }
        defaultSensitivity: { $ref: '#/components/schemas/Sensitivity' }
        dwgConversionEnabled: { type: boolean }
    DocumentVersion:
      type: object
      additionalProperties: false
      required:
        [
          version,
          status,
          parser,
          parserVersion,
          warnings,
          chunkCount,
          vectorCollection,
          embeddingFingerprint,
          indexedAt,
          activatedAt,
          supersededAt,
          createdAt,
        ]
      properties:
        version: { type: integer, minimum: 1 }
        status:
          {
            type: string,
            enum: [processing, prepared, policy_blocked, active, superseded, failed, deleted],
          }
        parser: { type: [string, 'null'] }
        parserVersion: { type: [string, 'null'] }
        warnings: { type: array, items: { type: string } }
        chunkCount: { type: integer, minimum: 0 }
        vectorCollection: { type: [string, 'null'], minLength: 1, maxLength: 255 }
        embeddingFingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        indexedAt: { type: [string, 'null'], format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        supersededAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    DocumentDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          sourceName,
          mimeType,
          department,
          sensitivity,
          ownerId,
          activeVersion,
          status,
          versions,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        sourceName: { type: string }
        mimeType: { type: string }
        department: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        ownerId: { type: string }
        activeVersion: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        versions: { type: array, items: { $ref: '#/components/schemas/DocumentVersion' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentChunk:
      type: object
      additionalProperties: false
      required:
        [
          id,
          documentVersion,
          ordinal,
          originalText,
          redactedText,
          tokenCount,
          page,
          sheet,
          sectionPath,
          elementTypes,
          previousChunkId,
          nextChunkId,
          redactionPolicyVersion,
          redactionSummary,
          createdAt,
        ]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{64}$' }
        documentVersion: { type: integer, minimum: 1 }
        ordinal: { type: integer, minimum: 0 }
        originalText: { type: string }
        redactedText: { type: string }
        tokenCount: { type: integer, minimum: 0 }
        page: { type: [integer, 'null'], minimum: 0 }
        sheet: { type: [string, 'null'], minLength: 1 }
        sectionPath: { type: array, items: { type: string } }
        elementTypes: { type: array, items: { type: string } }
        previousChunkId: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        nextChunkId: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        redactionPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        redactionSummary: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        createdAt: { type: string, format: date-time }
    DocumentPreview:
      type: object
      additionalProperties: false
      required:
        [
          documentId,
          sourceName,
          sourceMimeType,
          status,
          kind,
          contentType,
          renderer,
          rendererVersion,
          generatedAt,
          fallbackVersion,
          cad,
        ]
      properties:
        documentId: { type: string, format: uuid }
        sourceName: { type: string, minLength: 1 }
        sourceMimeType: { type: string, minLength: 1 }
        status: { type: string, enum: [ready, fallback, unavailable] }
        kind:
          {
            type: [string, 'null'],
            enum: [pdf, image, text, markdown, svg, cad_tiles, extracted, null],
          }
        contentType: { type: [string, 'null'], minLength: 1 }
        renderer: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        rendererVersion: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        generatedAt: { type: [string, 'null'], format: date-time }
        fallbackVersion: { type: [integer, 'null'], minimum: 1 }
        cad:
          oneOf:
            - $ref: '#/components/schemas/CadPreviewManifest'
            - type: 'null'
    CadPreviewBounds:
      type: object
      additionalProperties: false
      required: [minX, minY, maxX, maxY]
      properties:
        minX: { type: number }
        minY: { type: number }
        maxX: { type: number }
        maxY: { type: number }
    CadPreviewManifest:
      type: object
      additionalProperties: false
      required:
        [
          strategy,
          tileSize,
          minZoom,
          maxZoom,
          baseWidth,
          baseHeight,
          overviewWidth,
          overviewHeight,
          bounds,
          worldToPixel,
          entityCount,
          renderCostScore,
        ]
      properties:
        strategy: { const: tiles }
        tileSize: { type: integer, minimum: 256, maximum: 1024 }
        minZoom: { type: integer, minimum: 0, maximum: 15 }
        maxZoom: { type: integer, minimum: 0, maximum: 15 }
        baseWidth: { type: integer, minimum: 1 }
        baseHeight: { type: integer, minimum: 1 }
        overviewWidth: { type: integer, minimum: 1, maximum: 4096 }
        overviewHeight: { type: integer, minimum: 1, maximum: 4096 }
        bounds: { $ref: '#/components/schemas/CadPreviewBounds' }
        focusBounds:
          description: Optional robust main-geometry bounds used only for the initial and reset camera.
          $ref: '#/components/schemas/CadPreviewBounds'
        worldToPixel:
          type: array
          minItems: 6
          maxItems: 6
          items: { type: number }
        entityCount: { type: integer, minimum: 1, maximum: 2000000 }
        renderCostScore: { type: integer, minimum: 1, maximum: 100000000 }
    DocumentChunkListResponse:
      type: object
      additionalProperties: false
      required: [documentId, sourceName, documentVersion, items, page, pageSize, total]
      properties:
        documentId: { type: string, format: uuid }
        sourceName: { type: string }
        documentVersion: { type: integer, minimum: 1 }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DocumentChunk' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    DocumentDeleteResponse:
      type: object
      additionalProperties: false
      required: [documentId, deleted]
      properties:
        documentId: { type: string, format: uuid }
        deleted: { const: true }
    IngestionStatus:
      type: string
      enum:
        [
          queued,
          converting,
          parsing,
          chunking,
          policy_check,
          embedding,
          indexing,
          policy_blocked,
          completed,
          failed,
          deleted,
        ]
    IngestionJobSummary:
      type: object
      required:
        [
          id,
          documentId,
          version,
          kind,
          status,
          step,
          checkpoint,
          attempts,
          traceId,
          embeddingCompletedChunks,
          embeddingTotalChunks,
          embeddingBatchSize,
          errorCode,
          errorCategory,
          retryable,
          startedAt,
          completedAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [ingestion, reindex, index_migration] }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        step: { type: string }
        checkpoint: { type: string }
        attempts: { type: integer, minimum: 0 }
        traceId: { type: string, format: uuid }
        embeddingCompletedChunks: { type: integer, minimum: 0 }
        embeddingTotalChunks: { type: [integer, 'null'], minimum: 0 }
        embeddingBatchSize: { type: [integer, 'null'], minimum: 1 }
        errorCode: { type: [string, 'null'] }
        errorCategory: { type: [string, 'null'] }
        retryable: { type: boolean }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    IngestionJob:
      allOf:
        - { $ref: '#/components/schemas/IngestionJobSummary' }
        - type: object
          required: [sourceName, mimeType, parserVersion, embeddingFingerprint, warnings, createdAt]
          properties:
            sourceName: { type: string }
            mimeType: { type: string }
            parserVersion: { type: [string, 'null'] }
            embeddingFingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
            warnings: { type: array, items: { type: string } }
            createdAt: { type: string, format: date-time }
    IngestionJobListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/IngestionJob' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    IngestionRetryAccepted:
      type: object
      additionalProperties: false
      required: [jobId, status, traceId]
      properties:
        jobId: { type: string, format: uuid }
        status: { const: queued }
        traceId: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing, invalid or expired authentication session or bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated identity lacks the required capability
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource does not exist in the authenticated tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
